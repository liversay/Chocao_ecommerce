name: CI

on:
  push:
    branches: [main]
  # Sin filtro de ramas: los PRs apilados (base != main) también corren CI
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Dummy no-op: algunos módulos leen esta variable al importarse (lib/stripe.ts
    # lanza si falta), y CI no tiene .env. Los tests mockean Stripe/Clerk — nunca
    # se usa un valor real.
    env:
      STRIPE_SECRET_KEY: sk_test_ci_dummy
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Type-check (tsc --noEmit)
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Auditoría de dependencias
        run: bun audit --audit-level=high

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (tsc -b + vite build)
        run: bun run build

      - name: Auditoría de dependencias
        run: bun audit --audit-level=high
