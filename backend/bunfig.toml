[test]
preload = ["./src/test/preload.ts"]
# Bun aplica coverageThreshold POR ARCHIVO, no como agregado: con un umbral
# global fijo, cualquier archivo individual por debajo (p. ej. una ruta que
# quedó de capa fina tras extraer su lógica a services/*) tumba `bun test
# --coverage` aunque todos los tests pasen. Se reporta cobertura en CI sin
# gate duro hasta tener una política de umbral por-archivo real.
coverageSkipTestFiles = true
